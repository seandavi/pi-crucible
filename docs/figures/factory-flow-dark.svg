<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1820 670" width="1820" height="670" role="img" aria-label="The factory workflow: launch, spec (Opus), implement (Sonnet), parallel review lenses (Opus) with up to two revise rounds (Sonnet), then a PR (Sonnet) that a human merges. Spec or implement can stop and flag a human.">
<title>The factory workflow: launch, spec (Opus), implement (Sonnet), parallel review lenses (Opus) with up to two revise rounds (Sonnet), then a PR (Sonnet) that a human merges. Spec or implement can stop and flag a human.</title>
