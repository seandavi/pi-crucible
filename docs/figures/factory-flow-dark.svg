<text x="348" y="142" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="21" fill="#e6edf3" font-weight="650" text-anchor="start" xml:space="preserve">Spec · Opus</text>
<text x="348" y="177" font-family="'JetBrains Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="15" fill="#9198a1" font-weight="400" text-anchor="start" xml:space="preserve">docs/specs/</text>
