<text x="48" y="177" font-family="'JetBrains Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="15" fill="#9198a1" font-weight="400" text-anchor="start" xml:space="preserve">subagent({ workflow:</text>
<text x="48" y="200" font-family="'JetBrains Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="15" fill="#9198a1" font-weight="400" text-anchor="start" xml:space="preserve">  &quot;pi-factory&quot; })</text>
